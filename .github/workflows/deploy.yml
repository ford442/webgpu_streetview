name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target site
        required: true
        default: test
        type: choice
        options:
          - test
          - go

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Optional: only run on the canonical repo; remove or adjust for forks.
    if: github.repository == 'ford442/webgpu_streetview'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned emsdk version
        run: echo "EMSDK_VERSION=$(tr -d '[:space:]' < cpp/emsdk.version)" >> "$GITHUB_ENV"

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache-${{ env.EMSDK_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Verify install is complete
        run: node scripts/check-install.mjs --verbose

      # naga (WGSL) — `verify` fails in CI without it.
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache naga-cli
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/naga
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: naga-cli-${{ runner.os }}-v1

      - name: Install naga-cli (WGSL validation)
        run: command -v naga >/dev/null 2>&1 || cargo install naga-cli --locked

      # The same gate CI and the pre-push hook run: typecheck, lint, knip,
      # secrets, unit tests, WGSL, C++ goldens — a deploy cannot skip one.
      - name: Verify
        run: npm run verify

      # Scene depth (#320): the model ships under build/models/depth/ but is
      # not in git — fetch the pinned, SHA-256-checked files before building.
      - name: Fetch the scene-depth model
        run: npm run fetch:depth-model

      - name: Build production bundle
        run: npm run build
        env:
          REACT_APP_MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          VITE_MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deploy dependencies
        run: pip install requests

      - name: Deploy via Contabo bundle API
        run: python deploy.py
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
          DEPLOY_TARGET: ${{ inputs.target }}
