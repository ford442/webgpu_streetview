name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target site
        required: true
        default: test
        type: choice
        options:
          - test
          - go

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    # Optional: only run on the canonical repo; remove or adjust for forks.
    if: github.repository == 'ford442/webgpu_streetview'
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Read pinned emsdk version
        run: echo "EMSDK_VERSION=$(tr -d '[:space:]' < cpp/emsdk.version)" >> "$GITHUB_ENV"

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache-${{ env.EMSDK_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Verify install is complete
        run: node scripts/check-install.mjs --verbose

      # naga (WGSL) — `verify` fails in CI without it.
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache naga-cli
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/naga
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: naga-cli-${{ runner.os }}-v1

      - name: Install naga-cli (WGSL validation)
        run: command -v naga >/dev/null 2>&1 || cargo install naga-cli --locked

      # Names anything missing or the wrong version (emcc must equal cpp/emsdk.version) before the long steps.
      - name: Toolchain
        run: npm run check:toolchain

      # The same gate CI and the pre-push hook run: typecheck, lint, knip,
      # secrets, unit tests, WGSL, C++ goldens — a deploy cannot skip one.
      - name: Verify
        run: npm run verify

      # Scene depth (#320) + semantic (#352): the models ship under build/models/
      # but are not in git — fetch the pinned, SHA-256-checked files before building.
      - name: Fetch the scene models (depth #320, semantic #352)
        run: npm run fetch:models

      - name: Build production bundle
        run: npm run build
        env:
          # build-info.json must name a commit the tree actually IS (scripts/check-build-info.mjs).
          SV_REQUIRE_CLEAN: "1"
          REACT_APP_MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          VITE_MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deploy dependencies
        run: pip install requests

      - name: Deploy via Contabo bundle API
        run: python deploy.py
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
          DEPLOY_TARGET: ${{ inputs.target }}

      # "Deployed" has to mean "this commit is live": build-info.json on the host names the SHA that was
      # just built, the page's COOP/COEP arrive once each (a duplicate disables crossOriginIsolated) and every
      # built file is on the host. A green upload alone proved none of that (#358).
      - name: Resolve the deployed host
        id: target
        run: |
          host="test.1ink.us"; [ "${{ inputs.target }}" = "go" ] && host="go.1ink.us"
          echo "host=${host}" >> "$GITHUB_OUTPUT"

      - name: Verify the live site is this commit
        run: node scripts/verify-live.mjs --url "https://${{ steps.target.outputs.host }}/streetview/" --expect-sha "${{ github.sha }}" --files

      # ...and that it WORKS (#384): the production smoke against the live URL — the commit stamped in the
      # running bundle, the stamped service worker, COOP/COEP, wasm/shaders, first frame, hops, search,
      # cabin, a routed drive, the fallbacks — with 0 console errors and 0 failed requests required.
      # A live run spends real (metered) Maps calls, so the specs stay inside callBudget. Fails the workflow.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Post-deploy smoke (live)
        run: |
          npm run test:e2e:prod -- --live "https://${{ steps.target.outputs.host }}/streetview/" \
            --expect-sha "${{ github.sha }}" --screens live-screens
        env:
          CI: true

      - name: Upload the live smoke report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: live-smoke-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
            live-screens/
          retention-days: 30
