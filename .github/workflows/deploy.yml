name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target site
        required: true
        default: test
        type: choice
        options:
          - test
          - go

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Optional: only run on the canonical repo; remove or adjust for forks.
    if: github.repository == 'ford442/webgpu_streetview'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned emsdk version
        run: echo "EMSDK_VERSION=$(tr -d '[:space:]' < cpp/emsdk.version)" >> "$GITHUB_ENV"

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Verify install is complete
        run: node scripts/check-install.mjs --verbose

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # `--watchAll` is a CRA/Jest flag; vitest rejects unknown options and this
      # step failed unconditionally with CACError. `npm test` is already
      # non-watching (`vitest run`).
      - name: Run tests
        run: npm test

      - name: Check for committed deploy secrets
        run: bash scripts/check-deploy-secrets.sh

      - name: Build production bundle
        run: npm run build
        env:
          REACT_APP_MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          VITE_MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deploy dependencies
        run: pip install requests

      - name: Deploy via Contabo bundle API
        run: python deploy.py
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
          DEPLOY_TARGET: ${{ inputs.target }}
