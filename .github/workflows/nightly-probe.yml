name: Nightly hold-pause probe

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  hold-pause-probe:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'ford442/webgpu_streetview' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # e2e/scene-depth.spec.ts runs the real depth model (#320). The files are
      # not in git: without them the dev server's SPA fallback serves its 404
      # page and the spec fails the model's SHA-256 check. Same cache key as ci.yml.
      - name: Cache the scene-depth model
        uses: actions/cache@v4
        with:
          path: public/models/depth
          key: depth-model-${{ hashFiles('src/renderer/depth/depthModel.manifest.json') }}

      - name: Fetch the scene-depth model
        run: npm run fetch:depth-model

      - name: Start dev server
        run: npm start &
        env:
          REACT_APP_MAPS_API_KEY: ${{ secrets.REACT_APP_MAPS_API_KEY }}
          BROWSER: none

      - name: Wait for dev server
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000 > /dev/null && exit 0
            sleep 2
          done
          echo "Dev server did not become ready in time" >&2
          exit 1

      - name: Playwright E2E (full keyed suite)
        run: npm run test:e2e:keyed
        env:
          CI: true
          E2E_SKIP_WEBSERVER: '1'
          E2E_BASE_URL: http://127.0.0.1:3000
          REACT_APP_MAPS_API_KEY: ${{ secrets.REACT_APP_MAPS_API_KEY }}

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-keyed-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 14

      - name: Run hold-pause probe
        run: npm run probe:hold-pause
        env:
          REACT_APP_MAPS_API_KEY: ${{ secrets.REACT_APP_MAPS_API_KEY }}

      - name: Upload probe screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hold-pause-probe-screenshots
          path: repro-screenshots/hold-pause-probe/
          retention-days: 14

      # A red nightly must not be a badge nobody reads: open (or comment on) one
      # issue per failing night-streak, deduped by title.
      - name: Open a regression issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly hold-pause probe is failing"
          gh label create regression --color B60205 --description "Something that worked is broken" 2>/dev/null || true
          existing=$(gh issue list --state open --label regression --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again on $(git rev-parse --short HEAD): $RUN_URL"
          else
            gh issue create --title "$title" --label regression \
              --body "The nightly probe failed on $(git rev-parse --short HEAD): $RUN_URL"
          fi
