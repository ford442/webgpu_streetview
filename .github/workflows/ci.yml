name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR/branch supersedes the running one; main keeps
# every run so each merge has a full result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      # No emsdk here: `build-wasm-emscripten` proves the committed binaries equal
      # a pinned-emcc rebuild, and build-wasm.sh checks their source hash.
      SV_WASM_PREBUILT: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lockfile must stay clean
        run: git diff --exit-code package-lock.json

      # A partial install shows up as dozens of unrelated-looking type errors
      # (missing vite/vitest ambient types cascade into every *.module.css
      # import and every jest-dom matcher), so assert it before typecheck runs.
      - name: Verify install is complete
        run: node scripts/check-install.mjs --verbose

      - uses: dtolnay/rust-toolchain@stable

      # `cargo install naga-cli` compiles for minutes; cache the installed binary
      # and cargo's install metadata so a hit makes the install step a no-op.
      # Bump the trailing -v1 to force a fresh naga.
      - name: Cache naga-cli
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/naga
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: naga-cli-${{ runner.os }}-v1

      - name: Install naga-cli (WGSL validation)
        run: command -v naga >/dev/null 2>&1 || cargo install naga-cli --locked

      # The one gate: typecheck (tsc -b over app, tests, configs, e2e, scripts), lint,
      # knip, committed-secret scan, unit tests and WGSL validation. The native C++
      # goldens run in the wasm-cpp-host job, so skip them here.
      - name: Verify
        run: npm run verify -- --no-cpp

      - name: Deploy script config tests
        run: python3 deploy_secrets.test.py

      - name: Build
        # Vite build + wasm + verify-build (bundle budget + env-leak scan). Checks ran in `Verify` above.
        run: npm run build

      - name: Bundle size report
        # Visibility / SME artifact. Hard fail thresholds live in
        # scripts/check-bundle-budget.sh (invoked by verify-build.sh).
        # See docs/DEVELOPER_CONTEXT.md#6-chunk-strategy-bundle-size.
        run: |
          echo "### JS bundle sizes (gzip)" | tee -a "$GITHUB_STEP_SUMMARY"
          npx --no-install source-map-explorer 'build/static/js/*.js' --html /tmp/bundle-report.html || true
          for f in build/static/js/*.js; do
            gzip -c "$f" | wc -c | awk -v f="$f" '{printf "%s: %.1f kB\n", f, $1/1024}'
          done | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload bundle report
        uses: actions/upload-artifact@v5
        with:
          name: bundle-report
          path: /tmp/bundle-report.html
          if-no-files-found: ignore

      # 'hidden' source maps are not deployed; keep them to symbolicate a
      # production stack trace for the commit that built them.
      - name: Upload source maps
        uses: actions/upload-artifact@v5
        with:
          name: sourcemaps-${{ github.sha }}
          path: build/static/js/*.map
          if-no-files-found: warn
          retention-days: 30

  # Native (non-Emscripten) build of the C++ source of truth plus the golden
  # vector tests. This is the job that makes the cpp/src/*_module.cpp sources a
  # real source rather than an untested parity twin: it needs no emcc, no browser and
  # no Node, runs in seconds, and asserts the C++ against vectors captured from
  # the binary that actually ships. See docs/WASM_BRIDGE.md.
  wasm-cpp-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Host build + golden tests (g++, -Werror)
        run: |
          cmake -S cpp -B cpp/build-host -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER=g++
          cmake --build cpp/build-host -j"$(nproc)"
          ctest --test-dir cpp/build-host --output-on-failure

      # Gating: clang-format (cpp/.clang-format, checked — Ubuntu 24.04's
      # clang-format 18, the version the tree is formatted with) and
      # clang-tidy, whose WarningsAsErrors covers bugprone-*, clang-analyzer-*
      # and performance-* (pro-bounds-* and modernize-* only print). Missing
      # tools or a missing compilation database fail too, so the step cannot
      # silently skip.
      - name: clang-format + clang-tidy (gating)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy clang-format
          bash scripts/lint-cpp.sh

      # Two compilers because -Wconversion/-Wshadow diagnostics differ between
      # them, and emcc is clang — a clang-clean tree is what the WASM build needs.
      - name: Host build + golden tests (clang++, -Werror)
        run: |
          cmake -S cpp -B cpp/build-clang -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER=clang++
          cmake --build cpp/build-clang -j"$(nproc)"
          ctest --test-dir cpp/build-clang --output-on-failure

      # The goldens are memcmp'd, so a*b+c must round twice everywhere. clang
      # fuses it into an FMA whenever the target has one (aarch64 / Apple
      # Silicon, x86-64-v3, -march=native); cpp/CMakeLists.txt pins
      # -ffp-contract=off. This job is what keeps that flag from silently
      # going away — without it, 6 golden test cases fail here.
      - name: Host build + golden tests (clang++, -march=x86-64-v3 / FMA)
        run: |
          cmake -S cpp -B cpp/build-clang-v3 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS=-march=x86-64-v3
          cmake --build cpp/build-clang-v3 -j"$(nproc)"
          ctest --test-dir cpp/build-clang-v3 --output-on-failure

      # -fno-sanitize-recover=all (cpp/CMakeLists.txt) makes a finding abort; the
      # options keep the report readable. Without them UBSan only printed.
      - name: Host build + golden tests (ASan + UBSan)
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
        run: |
          cmake -S cpp -B cpp/build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++ -DSTREETVIEW_SANITIZERS=ON
          cmake --build cpp/build-asan -j"$(nproc)"
          ctest --test-dir cpp/build-asan --output-on-failure

      # clangd in cpp/ depends on this; a CMake change that drops it is a
      # silent developer-experience regression. After ASan, the repo-root
      # copy (if present) must still be the host snapshot — never a symlink
      # into build-asan and never sanitizer flags.
      - name: compile_commands.json is emitted and is not the ASan tree
        run: |
          test -f cpp/build-host/compile_commands.json
          if [ -L cpp/compile_commands.json ]; then
            echo "cpp/compile_commands.json must be a copy of build-host, not a symlink"
            ls -l cpp/compile_commands.json
            exit 1
          fi
          if [ -f cpp/compile_commands.json ] && grep -q -- '-fsanitize=address' cpp/compile_commands.json; then
            echo "cpp/compile_commands.json contains ASan flags after test:cpp:asan"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      # The goldens are generated from the committed binary, so regenerating
      # them must be a no-op. A diff here means either the binary changed
      # without `npm run gen:wasm-goldens`, or a golden file was hand-edited.
      - name: Golden vectors are reproducible from the committed binary
        run: |
          node scripts/gen-wasm-goldens.mjs
          git diff --exit-code cpp/tests/goldens.json cpp/tests/goldens_generated.h

  # Rebuild the WASM modules through the C++/Emscripten ship path and prove the
  # committed public/wasm/streetview-{wasm,dsp}.simd.wasm match this pinned emcc.
  build-wasm-emscripten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read pinned emsdk version
        run: echo "EMSDK_VERSION=$(tr -d '[:space:]' < cpp/emsdk.version)" >> "$GITHUB_ENV"

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache-${{ env.EMSDK_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build C++ → WASM via Emscripten (and copy the shipped binaries)
        run: npm run build:wasm:update

      - name: Committed wasm (main + worklet SIMD binaries) matches this emcc
        run: |
          git diff --exit-code public/wasm/
          test ! -e public/wasm/streetview-wasm.wasm

      # Signatures from the type sections vs abi.h, for both shipped binaries
      # and the scalar oracle; the worklet binary's no-grow/no-import/32 KB.
      - name: Binaries match abi.h by signature
        run: |
          node scripts/gen-wasm-abi.mjs --check
          node scripts/check-wasm-abi.mjs --main cpp/build-emscripten/out/streetview-wasm.wasm

      # The goldens are captured from the shipped SIMD binary; the scalar
      # build of the same sources (never deployed) must reproduce every one —
      # the cabin convolver's FFT and FIR included — bit for bit.
      - name: Scalar oracle reproduces the SIMD goldens bit for bit
        run: node scripts/gen-wasm-goldens.mjs --compare --wasm cpp/build-emscripten/out/streetview-wasm.wasm

      - name: Cabin DSP render budget (advisory)
        run: node scripts/bench-cabin-dsp.mjs --quanta 1500

  # The doctest suite (goldens included) as -msimd128 wasm with ASan + UBSan,
  # run under node: the real wasm_simd128.h path, not SIMDe.
  wasm-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read pinned emsdk version
        run: echo "EMSDK_VERSION=$(tr -d '[:space:]' < cpp/emsdk.version)" >> "$GITHUB_ENV"

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache-${{ env.EMSDK_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: emcc -msimd128 -fsanitize=address,undefined test suite (node)
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: bash scripts/test-wasm-sanitizers.sh

  e2e-smoke:
    runs-on: ubuntu-latest
    # Chromium smoke + the `gpu` lane. Over this means a spec is waiting on
    # something SwiftShader cannot do in time — move it to `gpu-models` (#358).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Read Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      # Browsers come from the cache; the OS libraries do not, so always install those.
      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # The real scene models (depth #320, semantic #352) are not fetched here:
      # their specs are the `gpu-models` project, which runs only in
      # nightly-probe.yml (one inference is ~220 s on SwiftShader, #358).
      - name: E2E smoke (keyless)
        run: npm run test:e2e:smoke
        env:
          CI: true
          # Explicitly keyless — missing-key banner + UI shell coverage.
          REACT_APP_MAPS_API_KEY: ''

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-smoke-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 14
