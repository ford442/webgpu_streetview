name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lockfile must stay clean
        run: git diff --exit-code package-lock.json

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Check for committed deploy secrets
        run: bash scripts/check-deploy-secrets.sh

      - name: Deploy script config tests
        run: python3 deploy_secrets.test.py

      - name: Build
        # Vite build + wasm + verify-build (bundle budget). Lint is a separate step above.
        run: npm run build

      - name: Bundle size report
        # Visibility / SME artifact. Hard fail thresholds live in
        # scripts/check-bundle-budget.sh (invoked by verify-build.sh).
        # See docs/DEVELOPER_CONTEXT.md#6-chunk-strategy-bundle-size.
        run: |
          echo "### JS bundle sizes (gzip)" | tee -a "$GITHUB_STEP_SUMMARY"
          npx --no-install source-map-explorer 'build/static/js/*.js' --html /tmp/bundle-report.html || true
          for f in build/static/js/*.js; do
            gzip -c "$f" | wc -c | awk -v f="$f" '{printf "%s: %.1f kB\n", f, $1/1024}'
          done | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload bundle report
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: /tmp/bundle-report.html
          if-no-files-found: ignore

  # Optional parity check: rebuild the WASM module through the full C++/Emscripten
  # path (cpp/src/noise_module.cpp) instead of the hand-written WAT source, so a
  # regression in the C++ implementation doesn't go unnoticed. Not required for
  # merge — the WAT-built public/wasm/streetview-wasm.wasm committed to the repo
  # is what actually ships.
  build-wasm-emscripten:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build:wasm

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke (keyless)
        run: npm run test:e2e:smoke
        env:
          CI: true
          # Explicitly keyless — missing-key banner + UI shell coverage.
          REACT_APP_MAPS_API_KEY: ''

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 14
