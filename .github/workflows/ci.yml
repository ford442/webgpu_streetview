name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No package-lock.json is committed (see .gitignore), so `npm ci` and
      # setup-node's built-in `cache: npm` (which requires a lockfile to hash)
      # aren't usable here.
      - run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --watchAll=false

      - name: Build
        # CRA fails on pre-existing ESLint warnings when CI=true, so override
        # the runner's default CI=true just for this step (build/build:wasm,
        # patch-cesium-bundle.sh, and verify-build.sh all run as part of
        # `npm run build` and any failure here blocks the merge).
        run: npm run build
        env:
          CI: false

      - name: Bundle size report
        # Visibility only — does not fail the build. Watches for regressions
        # like Cesium (or another heavy dep) creeping back into main.js; see
        # docs/DEVELOPER_CONTEXT.md#6-chunk-strategy-bundle-size.
        run: |
          echo "### JS bundle sizes (gzip)" | tee -a "$GITHUB_STEP_SUMMARY"
          npx --no-install source-map-explorer 'build/static/js/*.js' --html /tmp/bundle-report.html || true
          for f in build/static/js/*.js; do
            gzip -c "$f" | wc -c | awk -v f="$f" '{printf "%s: %.1f kB\n", f, $1/1024}'
          done | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload bundle report
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: /tmp/bundle-report.html
          if-no-files-found: ignore

  # Optional parity check: rebuild the WASM module through the full C++/Emscripten
  # path (cpp/src/noise_module.cpp) instead of the hand-written WAT source, so a
  # regression in the C++ implementation doesn't go unnoticed. Not required for
  # merge — the WAT-built public/wasm/streetview-wasm.wasm committed to the repo
  # is what actually ships.
  build-wasm-emscripten:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run build:wasm
