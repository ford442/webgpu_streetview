<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>1ink.us Streetview</title>
    <meta name="description" content="WebGPU Fluid Simulation Street View Experience">
    <!-- COEP credentialless allows cross-origin resources (Google Maps) without CORP headers.
         If your server sends 'require-corp', change it to 'credentialless' or remove COEP.
         This meta tag only applies when no COEP header is sent by the server. -->
    <meta http-equiv="Cross-Origin-Embedder-Policy" content="credentialless">
    <style>
      body { margin: 0; background-color: #000; overflow: hidden; }
      /* Suppress the Google Maps "This page can't load Google Maps correctly" warning
         overlay. The map is hidden behind WebGPU canvas; our own error UI handles
         actual failures via the onError prop in StreetView.tsx. */
      .gm-err-container,
      .gm-err-content,
      .gm-err-message,
      .gm-err-title,
      .gm-err-icon,
      .gm-err-map,
      .gm-err-code { display: none !important; }
    </style>
  </head>
  <script>
  // Force preserveDrawingBuffer on all WebGL contexts to allow capturing the canvas
  const originalGetContext = HTMLCanvasElement.prototype.getContext;
  HTMLCanvasElement.prototype.getContext = function(type, options) {
    if (type === 'webgl' || type === 'webgl2') {
      options = options || {};
      options.preserveDrawingBuffer = true;
    }
    return originalGetContext.call(this, type, options);
  };
</script>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
